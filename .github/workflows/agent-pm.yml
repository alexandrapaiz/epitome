name: pm-agent

on:
  # schedule: retired 2026-10-17 (HQ decision 056): every seat's clock is its manifest on the host; GitHub is an event source, not a runtime
  repository_dispatch:
    types: [asc.pm]   # the event bus wakes this seat (standards/pm.md §17)
  workflow_dispatch:
    inputs:
      owner_instructions:
        description: "Owner instructions for this run (binding for this run)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write # §11.7: the standup reruns failed runs; §11: it dispatches seats
  pull-requests: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENROUTE: ${{ secrets.OPENROUTE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      BOARD_API_URL: ${{ secrets.BOARD_API_URL }}
      BOARD_RUNTIME_TOKEN: ${{ secrets.BOARD_RUNTIME_TOKEN }}
      # Traces: this run lands in Langfuse as one trace, a span per tool call
      # (runtime/langfuse/ in the HQ repo). The auth header is set by the step below.
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.LANGFUSE_HOST }}/api/public/otel
      OTEL_LOG_USER_PROMPTS: "1"
      OTEL_LOG_ASSISTANT_RESPONSES: "1"
      OTEL_LOG_TOOL_DETAILS: "1"
      OTEL_RESOURCE_ATTRIBUTES: service.name=epitome-pm,langfuse.environment=epitome,langfuse.user.id=pm,langfuse.session.id=${{ github.run_id }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Open routing is opt-in and best-effort. It runs ONLY when the repo
      # variable OPEN_ROUTING is "on", because every Kimi attempt so far has
      # died at turn one (2026-09-21 x2, 2026-09-24 epitome pm) and each doomed
      # attempt burned ~3 minutes before the Claude fallback took over.
      # Flip it on:  gh variable set OPEN_ROUTING --body on
      # Flip it off: gh variable set OPEN_ROUTING --body off   (or delete it)
      # The secret stays stored either way (HQ Incident 4).
      - name: Trace this run to Langfuse
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          if [ -z "$LANGFUSE_PUBLIC_KEY" ] || [ -z "$LANGFUSE_SECRET_KEY" ]; then
            echo "No Langfuse keys on this repo; this run is not traced."
            echo "OTEL_TRACES_EXPORTER=none" >> "$GITHUB_ENV"; exit 0
          fi
          auth=$(printf '%s:%s' "$LANGFUSE_PUBLIC_KEY" "$LANGFUSE_SECRET_KEY" | base64 -w0)
          echo "::add-mask::$auth"
          echo "OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic $auth" >> "$GITHUB_ENV"
          echo "Traced: seat pm of epitome, run ${{ github.run_id }}."
      - name: Seat run (open-routed)
        id: openrouted
        if: vars.OPEN_ROUTING == 'on' && env.OPENROUTE != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.OPENROUTE_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTE_API_KEY }}
        with:
          # A PM dispatch (pm.md 11.5) starts this run as github-actions[bot],
          # and claude-code-action agent mode refuses a non-User actor unless it
          # is named here. Without it a dispatched seat dies before it reads its
          # charter. See ADR-049 and standards/workflow-template.yml.
          allowed_bots: "github-actions[bot]"
          anthropic_api_key: ${{ secrets.OPENROUTE_API_KEY }}
          prompt: |
            You are epito.me's pm seat, running in GitHub Actions with
            this repository checked out. Read prompts/pm-agent.md; it is
            your full charter. Within your first turns, create a branch
            pm/YYYY-MM-DD-slug (today's date) and open a DRAFT pull
            request with `gh pr create --draft`, committing into it as you
            work — a died run must still ship its partial work. Open exactly
            one PR. Never merge your own PR, never push to main, never touch
            secrets, never edit charters. If the charter file is missing,
            stop and fail loudly instead of improvising.
            Event that woke this run, when the event bus started it (empty on a schedule or a dispatch): ${{ github.event.client_payload.text }}
            You also own merges and failed runs: merge Tier B pull requests under standards/pm.md §10, and triage this company's failed runs under §11.7, every run.
            The board is where you plan (standards/pm.md §14): read it first, keep every item you touch in a column, comment PR links; when the owner is on, you are on: run the standup from the board and its Messages and answer what is addressed to pm.
            Event that woke this run, when the event bus started it (empty on a schedule or a dispatch): ${{ github.event.client_payload.text }}
            Owner instructions for this dispatch, binding for this run
            (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 100 --permission-mode bypassPermissions --model ${{ vars.OPENROUTE_MODEL || 'kimi-k2.7-code' }}"
      - name: Seat run (Claude)
        if: vars.OPEN_ROUTING != 'on' || env.OPENROUTE == '' || steps.openrouted.outcome != 'success'
        uses: anthropics/claude-code-action@v1
        with:
          # A PM dispatch (pm.md 11.5) starts this run as github-actions[bot],
          # and claude-code-action agent mode refuses a non-User actor unless it
          # is named here. Without it a dispatched seat dies before it reads its
          # charter. See ADR-049 and standards/workflow-template.yml.
          allowed_bots: "github-actions[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are epito.me's pm seat, running in GitHub Actions with
            this repository checked out. Read prompts/pm-agent.md; it is
            your full charter. Within your first turns, create a branch
            pm/YYYY-MM-DD-slug (today's date) and open a DRAFT pull
            request with `gh pr create --draft`, committing into it as you
            work — a died run must still ship its partial work. Open exactly
            one PR. Never merge your own PR, never push to main, never touch
            secrets, never edit charters. If the charter file is missing,
            stop and fail loudly instead of improvising.
            Owner instructions for this dispatch, binding for this run
            (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 100 --permission-mode bypassPermissions --model claude-sonnet-5"
      # The no-ship tripwire. Runs have worked for dozens of turns, reported
      # success, and lost everything at teardown because nothing was pushed
      # (alexandria's register; incident numbering differs per repo). A green
      # conclusion is not evidence of shipping.
      - name: No-ship tripwire
        if: always()
        run: |
          git fetch origin --quiet 2>/dev/null || true
          branch=$(git rev-parse --abbrev-ref HEAD)
          base="${GITHUB_REF_NAME:-main}"
          dirty=$(git status --porcelain)
          commits=0
          if git rev-parse "origin/$base" >/dev/null 2>&1; then
            commits=$(git rev-list --count "origin/$base..HEAD" 2>/dev/null || echo 0)
          fi
          # Remote branches containing HEAD, EXCLUDING the base branch itself. A run
          # that never branched leaves HEAD on origin/$base, which used to satisfy
          # this check trivially: epitome run 35956231272 (2026-09-24) died at turn
          # one, produced nothing, and the tripwire still reported success.
          pushed=$(git branch -r --contains HEAD 2>/dev/null | tr -d ' ' | grep -v "^origin/$base$" || true)
          pr=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "### Did this run ship anything?"
            echo ""
            echo "- branch: \`$branch\` ($commits commit(s) ahead of $base)"
            echo "- pushed to a seat branch: ${pushed:-NO}"
            echo "- pull request: ${pr:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$dirty" ]; then
            echo "::warning::Uncommitted changes were left in the sandbox and are lost at teardown."
            printf '%s\n' "$dirty" | head -20
          fi
          if [ "$commits" = "0" ] && [ -z "$pr" ] && [ -z "$dirty" ]; then
            echo "::error::This run produced nothing at all: no commit, no seat branch, no pull request. A green model step is not evidence of work; read the seat run step's own outcome."
            exit 1
          fi
          if [ "$commits" != "0" ] && [ -z "$pushed" ]; then
            echo "::error::This run made commits that were never pushed, so the work dies with the sandbox. See the 'Ship first, then work' rule in the pm standard (section 8) and in this seat's charter."
            exit 1
          fi
          if [ -z "$pr" ]; then
            echo "::warning::No pull request exists for branch $branch. A run with nothing to ship must say so in a draft PR and close it, rather than ending silently."
          fi
      # Visibility window (standards/operating-modes.md §3): the seat's run
      # report goes to the team's channel when the owner has created one.
      # Seats never read the channel; it is the owner's window only.
      - name: Report this run to the board
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -n "$BOARD_API_URL" ] && [ -n "$BOARD_RUNTIME_TOKEN" ] || { echo "no board on this repo"; exit 0; }
          branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)
          pr=$(gh pr list --state all --author "@me" --limit 1 --json url,body,headRefName --jq '.[0]' 2>/dev/null || echo "")
          [ -n "$pr" ] || pr=$(gh pr list --head "$branch" --state all --json url,body --jq '.[0]' 2>/dev/null || echo "")
          python3 - "$pr" <<'PY'
          import json, os, sys, urllib.request
          pr = json.loads(sys.argv[1]) if sys.argv[1] else {}
          report = (pr.get("body") or "").split("\n🤖")[0].strip()[:2000]
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          status = os.environ.get("JOB_STATUS", "unknown")
          msg = {"company": "epitome", "seat": "pm", "trigger": os.environ.get("GITHUB_EVENT_NAME", ""),
                 "run_url": run_url, "pr_url": pr.get("url") or None, "exit": 0 if status == "success" else 1,
                 "report": report or ("The run ended with status " + status + " and opened no pull request.")}
          req = urllib.request.Request(os.environ["BOARD_API_URL"].rstrip("/") + "/api/runs", data=json.dumps(msg).encode(), method="POST",
                                       headers={"Authorization": "Bearer " + os.environ["BOARD_RUNTIME_TOKEN"], "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print("board run report:", r.status)
          except Exception as e:
              print("board run report failed:", e)
          PY
