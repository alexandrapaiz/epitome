# Seat workflow template — copy into .github/workflows/agent-exo.yml
# when standing up a seat (ADR-4; playbook order: okr, pm, exo, builders).
# Kept OUT of .github/workflows until CLAUDE_CODE_OAUTH_TOKEN exists.
# The four gotchas from alexandria's incident register are already baked
# in below: id-token write, bypassPermissions, explicit --model,
# draft-PR-first in the prompt.

name: exo-agent

on:
  # schedule:   # weekly Sun drift review — enable after supervised smoke run
  #   - cron: "6 11 * * 1"   # uncomment only after a supervised smoke run
  workflow_dispatch:
    inputs:
      owner_instructions:
        description: "Owner instructions for this run (binding for this run)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are epito.me's exo seat, running in GitHub Actions with
            this repository checked out. Read prompts/exo-agent.md; it is
            your full charter. Within your first turns, create a branch
            exo/YYYY-MM-DD-slug and open a DRAFT pull request with
            `gh pr create --draft`, committing into it as you work — a died
            run must still ship its partial work. Open exactly one PR. Never
            merge your own PR, never push to main, never touch secrets,
            never edit charters. If the charter file is missing, stop and
            fail loudly instead of improvising.
            Owner instructions for this dispatch, binding for this run
            (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 120 --permission-mode bypassPermissions --model claude-opus-5"
      # The no-ship tripwire. Runs have worked for dozens of turns, reported
      # success, and lost everything at teardown because nothing was pushed
      # (alexandria's register; incident numbering differs per repo). A green
      # conclusion is not evidence of shipping.
      - name: No-ship tripwire
        if: always()
        run: |
          git fetch origin --quiet 2>/dev/null || true
          branch=$(git rev-parse --abbrev-ref HEAD)
          dirty=$(git status --porcelain)
          pushed=$(git branch -r --contains HEAD 2>/dev/null | tr -d ' ')
          pr=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "### Did this run ship anything?"
            echo ""
            echo "- branch: \`$branch\`"
            echo "- pushed to a remote branch: ${pushed:-NO}"
            echo "- pull request: ${pr:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$dirty" ]; then
            echo "::warning::Uncommitted changes were left in the sandbox and are lost at teardown."
            printf '%s\n' "$dirty" | head -20
          fi
          if [ -z "$pushed" ]; then
            echo "::error::This run made commits that were never pushed, so the work dies with the sandbox. See the 'Ship first, then work' rule in the pm standard (§8) and in this seat's charter."
            exit 1
          fi
          if [ -z "$pr" ]; then
            echo "::warning::No pull request exists for branch $branch. A run with nothing to ship must say so in a draft PR and close it, rather than ending silently."
          fi
      # Visibility window (standards/operating-modes.md §3): the seat's run
      # report goes to the team's channel when the owner has created one.
      # Seats never read the channel; it is the owner's window only.
      - name: Post run report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # The guard lives in the script, not in the step's `if`: a step
          # cannot read its own `env:` block from its `if` condition, and the
          # `secrets` context is not available there either, so gating in YAML
          # would either always skip or leak the webhook into the job env that
          # the seat itself can read.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No SLACK_WEBHOOK_URL configured; the visibility window is not open yet."
            exit 0
          fi
          branch=$(git rev-parse --abbrev-ref HEAD)
          pr=$(gh pr list --head "$branch" --state all --json number,title,url,body --jq '.[0]' 2>/dev/null)
          title=$(echo "$pr" | jq -r '.title // "no PR opened"'); url=$(echo "$pr" | jq -r '.url // ""')
          # Prose, not a log line (owner, 2026-09-26: "communications are pretty dead on slack"):
          # the report is the PR description's opening — its first paragraphs, up to ~900 chars.
          summary=$(echo "$pr" | jq -r '.body // ""' | sed -e 's/^#\+ *//' -e '/^🤖/d' -e '/^$/N;/^\n$/D' | tr -s '\n' | head -c 900)
          curl -s -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" \
            --data "$(jq -nc --arg t "*${{ github.workflow }}* · ${{ job.status }} · $title" --arg s "$summary" --arg u "$url" '{text: ($t + (if $s != "" then "\n" + $s else "" end) + (if $u != "" then "\n" + $u else "" end))}')" >/dev/null || true
